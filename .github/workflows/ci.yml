name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: OCR sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  image:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: passbot:ci
      # A vulnerable base image is the most likely way this service gets
      # compromised, so the build fails on anything HIGH or above.
      #
      # Note the operational consequence: this job can go red without any code
      # change, when a new CVE is disclosed against something in the base
      # image. That is intended. The response is to rebuild on an updated
      # base, or to remove the offending component if it isn't needed at
      # runtime (as the Dockerfile does for npm/yarn). Resist the urge to add
      # blanket ignores; the gate is only worth having if red means something.
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passbot:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
