# Fly.io deployment.
#
# Socket Mode means there are no [[services]] and no public IP: the machine
# makes an outbound WebSocket connection to Slack and accepts nothing inbound.
# That also gives the smallest attack surface.
#
# Secrets are set out of band and never appear in this file:
#   fly secrets set SLACK_BOT_TOKEN=... SLACK_APP_TOKEN=...

app = "passbot"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  INTAKE_MODE = "dm_only"
  OCR_SIDECAR_URL = "http://127.0.0.1:8000"
  MAX_CONCURRENT_JOBS = "2"

[[vm]]
  size = "shared-cpu-1x"
  # OpenCV plus Tesseract need headroom during decode; 256 MB OOMs on large
  # photographs.
  memory = "512mb"
  cpus = 1

# No auto-stop: the process must stay connected to Slack to receive events.
[deploy]
  strategy = "immediate"
